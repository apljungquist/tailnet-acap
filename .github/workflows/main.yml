name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Keep in sync with `UBUNTU_VERSION` in `.devcontainer/Dockerfile`.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Global setup
        working-directory: .devhost
        run: |
          sudo ./install-system-packages.sh
          ./install-rust.sh

      - name: Restore cargo build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Run checks on host
        run: |
          make --always-make \
            check_build_host \
            check_docs \
            check_format \
            check_lint_host \
            check_tests

      - name: Save cargo build artifacts
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Keep in sync with `UBUNTU_VERSION` in `.devcontainer/Dockerfile`.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            extra-substituters = https://apljungquist-nix4a.cachix.org
            extra-trusted-public-keys = apljungquist-nix4a.cachix.org-1:Yj3rxpT1mYooTE5v/Mmg1ueialsp5BIcJWJ8MirbEmU=

      # Keep the nix4a revision in sync with `release.yml`.
      - name: Install the SDK at /opt/axis
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt
          nix build --out-link /opt/axis --print-out-paths \
            'github:apljungquist/nix4a/be53bdd8e09ed1cbcc89dcab184ccdf650ea7dba#acap-native-sdk-12'

      - name: Global setup
        working-directory: .devhost
        run: |
          sudo ./install-system-packages.sh
          ./install-rust.sh

      - name: Restore venv
        id: cache-venv
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devhost/venv
          key: venv-${{ runner.os }}-${{ hashFiles('.devhost/install-venv.sh', '.devhost/requirements.txt', '.devhost/constraints.txt') }}

      - name: Local setup
        if: steps.cache-venv.outputs.cache-hit != 'true'
        working-directory: .devhost
        run: ./install-venv.sh "$PWD/venv"

      - name: Save venv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devhost/venv
          key: venv-${{ runner.os }}-${{ hashFiles('.devhost/install-venv.sh', '.devhost/requirements.txt', '.devhost/constraints.txt') }}

      - name: Restore cargo build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Run checks for target
        run: |
          source .devhost/venv/bin/activate
          source .devhost/environment-setup.sh
          rm -rf target/acap
          make --always-make \
            check_build_target \
            check_generated_files \
            check_lint_target

      - name: Save cargo build artifacts
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
