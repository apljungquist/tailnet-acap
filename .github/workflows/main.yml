name: CI

on:
  push:
    branches: [ main, pre-main ]

permissions:
  contents: read

jobs:
  check:
    # Keep in sync with `UBUNTU_VERSION` in `.devcontainer/Dockerfile`.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Global setup
        working-directory: .devhost
        run: |
          sudo ./install-system-packages.sh
          ./install-rust.sh

      - name: Restore cargo build artifacts
        id: cache-cargo
        if: github.ref_name == 'pre-main'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Run checks on host
        run: |
          make --always-make \
            check_build_host \
            check_docs \
            check_format \
            check_lint_host \
            check_tests

      - name: Save cargo build artifacts
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}

  build:
    # Keep in sync with `UBUNTU_VERSION` in `.devcontainer/Dockerfile`.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SDK location
        run: echo "ACAP_SDK_LOCATION=$HOME/axis" >> "$GITHUB_ENV"

      - name: Restore SDK
        id: cache-sdk
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.ACAP_SDK_LOCATION }}
          key: acap-sdk-${{ runner.os }}-${{ hashFiles('.devhost/install-sdk.sh') }}

      - name: Install SDK from docker
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        working-directory: .devhost
        run: |
          mkdir -p "$ACAP_SDK_LOCATION"
          ./install-sdk.sh "$ACAP_SDK_LOCATION"
          docker system prune --all --force

      - name: Save SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.ACAP_SDK_LOCATION }}
          key: acap-sdk-${{ runner.os }}-${{ hashFiles('.devhost/install-sdk.sh') }}

      - name: Global setup
        working-directory: .devhost
        run: |
          sudo ./install-system-packages.sh
          sudo ln -sfn "$ACAP_SDK_LOCATION" /opt/axis
          ./install-rust.sh

      - name: Restore venv
        id: cache-venv
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devhost/venv
          key: venv-${{ runner.os }}-${{ hashFiles('.devhost/install-venv.sh', '.devhost/requirements.txt', '.devhost/constraints.txt') }}

      - name: Local setup
        if: steps.cache-venv.outputs.cache-hit != 'true'
        working-directory: .devhost
        run: ./install-venv.sh "$PWD/venv"

      - name: Save venv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .devhost/venv
          key: venv-${{ runner.os }}-${{ hashFiles('.devhost/install-venv.sh', '.devhost/requirements.txt', '.devhost/constraints.txt') }}

      - name: Restore cargo build artifacts
        id: cache-cargo
        if: github.ref_name == 'pre-main'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Run checks for target
        run: |
          source .devhost/venv/bin/activate
          source .devhost/environment-setup.sh
          rm -rf target/acap
          make --always-make \
            check_build_target \
            check_generated_files \
            check_lint_target

      - name: Save cargo build artifacts
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
